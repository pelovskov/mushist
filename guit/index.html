<style>
  :root{
    --paper:#EDE7D8; --card:#1B1A16; --card-text:#F2ECDD; --card-bg:#fbf8ef;
    --ink:#211E19; --rust:#9A4630; --moss:#5C6B4F; --line:#d8d0ba;
    --footer-color:#6B6455; --muted:#6B6455; --footer-strong:#4A463C;
    --row-hover:#f2ecdd;
    --body-text:#3a362e; --quote-text:#5a5646; --code-bg:#efe9d8;
    --serif: Arial, 'Helvetica Neue', Helvetica, 'Liberation Sans', sans-serif;
    --sans: Arial, 'Helvetica Neue', Helvetica, 'Liberation Sans', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); display:flex; justify-content:center; padding:28px 14px;
  }
  .card{
    width:100%; max-width:420px; background:var(--card-bg); border:1px solid var(--line);
    border-radius:16px; overflow:hidden; box-shadow:0 10px 30px rgba(30,25,15,0.12);
  }
  .eyebrow{
    text-align:center; font-size:13.5px; letter-spacing:0.1em; font-weight:700;
    color:var(--moss); text-transform:uppercase; padding:16px 16px 4px;
  }
  .cover{ margin:14px 16px 0; border-radius:10px; overflow:hidden; }
  .cover img{ width:100%; display:block; aspect-ratio:16/10.5; object-fit:cover; }
  .title{
    font-family:var(--serif); font-size:26px; line-height:1.3; text-align:center;
    padding:18px 20px 6px; font-weight:700; margin:0;
  }
  .location{ text-align:center; font-size:16px; color:var(--muted); padding-bottom:8px; }

  .rows{ list-style:none; margin:10px 16px 6px; padding:0; }
  .rows li{ margin-bottom:10px; }
  .row{
    display:flex; align-items:center; gap:14px;
    min-height:66px; padding:12px 14px;
    background:var(--card-bg); border:1px solid var(--line); border-radius:12px;
    text-decoration:none; color:var(--ink);
  }
  .row:hover, .row:active{ background:var(--row-hover); border-color:var(--rust); }
  .row:focus-visible{ outline:3px solid var(--rust); outline-offset:3px; }
  .rowicon{
    flex:0 0 auto; width:42px; height:42px; border-radius:50%;
    background:var(--card); display:flex; align-items:center; justify-content:center;
  }
  .rowicon svg{ width:18px; height:18px; margin-left:2px; }
  .rowtitle{
    display:block; font-family:var(--serif); font-size:18px; font-weight:700; line-height:1.3;
  }
  .rowsub{ display:block; font-size:14.5px; color:var(--muted); margin-top:2px; }
  .tom{ margin:16px; color:var(--muted); font-size:15px; text-align:center; }

  .desc{ margin:8px 16px 18px; border-top:1px solid var(--line); padding-top:12px; }
  .desc summary{
    display:flex; align-items:center; justify-content:space-between;
    cursor:pointer; list-style:none; padding:6px 6px 6px 20px;
    font-family:var(--serif); font-size:18px; font-weight:700; color:var(--ink);
  }
  .desc summary::-webkit-details-marker{ display:none; }
  .desc summary::marker{ content:''; }
  .desc .chevron{ color:var(--rust); font-size:17px; transition: transform .2s ease; flex-shrink:0; margin-left:10px; }
  .desc[open] .chevron{ transform:rotate(180deg); }
  .desc-body{ padding:10px 6px 4px 20px; font-size:16.5px; line-height:1.75; color:var(--body-text); }
  .desc-body p{ margin:0 0 12px; }
  .desc-body p:last-child{ margin-bottom:0; }
  .desc-body h2, .desc-body h3, .desc-body h4, .desc-body h5{
    font-family:var(--serif); color:var(--ink); margin:20px 0 8px; line-height:1.3;
  }
  .desc-body h2{ font-size:21px; }
  .desc-body h3{ font-size:18px; }
  .desc-body h4, .desc-body h5{ font-size:17px; }
  .desc-body h2:first-child, .desc-body h3:first-child{ margin-top:2px; }
  .desc-body hr{ border:none; border-top:1px solid var(--line); margin:20px 0; }
  .desc-body ul, .desc-body ol{ margin:0 0 12px; padding-left:22px; }
  .desc-body li{ margin-bottom:6px; }
  .desc-body blockquote{
    margin:0 0 12px; padding-left:12px; border-left:3px solid var(--rust); color:var(--quote-text); font-style:italic;
  }
  .desc-body a{ color:var(--rust); }
  .desc-body code{ background:var(--code-bg); padding:1px 5px; border-radius:3px; font-size:15px; }

  .meta{ margin:2px 16px 16px; border-top:1px solid var(--line); padding-top:10px; }
  .meta summary{
    display:flex; align-items:center; justify-content:space-between;
    cursor:pointer; list-style:none; padding:6px 6px 6px 20px;
    font-size:15px; font-weight:700; color:var(--footer-strong);
  }
  .meta summary::-webkit-details-marker{ display:none; }
  .meta summary::marker{ content:''; }
  .meta .chevron{ color:var(--rust); font-size:14px; transition: transform .2s ease; flex-shrink:0; margin-left:10px; }
  .meta[open] .chevron{ transform:rotate(180deg); }
  .meta-list{ margin:8px 0 4px; padding:0 6px 0 20px; font-size:14.5px; }
  .meta-row{ padding:6px 0; border-bottom:1px solid var(--line); }
  .meta-row:last-child{ border-bottom:none; }
  .meta dt{ color:var(--muted); font-size:13.5px; }
  .meta dd{ margin:2px 0 0; color:var(--body-text); line-height:1.5; }
  .meta .dc-tag{ opacity:0.7; font-size:12.5px; }

  .cta-wrap{ padding:6px 16px 18px; text-align:center; }
  .cta-btn{
    display:block; width:100%;
    background:var(--rust); color:var(--card-text);
    text-decoration:none; text-align:center;
    font-size:16px; font-weight:700; letter-spacing:0.02em;
    padding:14px 18px; border-radius:12px;
    box-shadow:0 3px 10px rgba(30,25,15,0.15);
    transition: filter .15s ease, transform .1s ease;
  }
  .cta-btn:hover{ filter:brightness(0.92); }
  .cta-btn:active{ transform:translateY(1px); }
  .cta-btn:focus-visible{ outline:3px solid var(--rust); outline-offset:3px; }

  .footer{
    display:flex; flex-direction:column; align-items:center; gap:12px;
    text-align:center; padding:4px 20px 22px;
  }
  .footer-note{ font-size:14px; color:var(--footer-strong); font-style:italic; }
</style>
