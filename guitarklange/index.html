<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c4a63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Guitarklange">
<link rel="apple-touch-icon" href="ikon-192.png">
<link rel="manifest" href="manifest.json">
<title>Guitarklange</title>
<meta name="DC.title" content="Guitarklange">
<meta name="DC.publisher" content="Privat">
<meta name="DC.date" content="2026-09-03">
<meta name="DC.type" content="Sound">
<meta name="DC.format" content="PWA (HTML + MP3)">
<meta name="DC.language" content="da">
<meta name="DC.rights" content="Privat brug">
<style>
:root{
  --bg:#f4f1eb;
  --surface:#ffffff;
  --ink:#221f1b;
  --ink-soft:#5d5750;
  --accent:#2c4a63;
  --on-accent:#ffffff;
  --line:#d9d3c8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--ink);
  font-size:19px;line-height:1.45;
  padding-bottom:150px;
  -webkit-text-size-adjust:100%;
}
header{padding:28px 22px 14px;max-width:900px;margin:0 auto}
h1{font-size:31px;line-height:1.15;margin:0;letter-spacing:-.01em;font-weight:700}
header p{margin:8px 0 0;color:var(--ink-soft);font-size:18px}

main{max-width:900px;margin:0 auto;padding:8px 22px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}

.card{
  background:var(--surface);border:2px solid var(--line);border-radius:16px;
  overflow:hidden;display:flex;flex-direction:column;
}
.card.playing{border-color:var(--accent)}
.cover{aspect-ratio:16/10;width:100%;object-fit:cover;display:block;background:var(--line)}
.cover.none{display:flex;align-items:center;justify-content:center;font-size:52px;color:var(--ink-soft);opacity:.35}
.card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;flex:1}
.card h2{margin:0;font-size:22px;line-height:1.2;font-weight:650}
.card .meta{margin:0;color:var(--ink-soft);font-size:16px}
.card .actions{margin-top:auto;display:flex;flex-direction:column;gap:8px}

button{font:inherit;cursor:pointer;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:14px 16px;min-height:56px}
button:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
.play{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-size:21px;font-weight:650}
.queue{font-size:17px;min-height:48px;padding:10px 14px}
.queue.on{border-color:var(--accent);color:var(--accent);font-weight:600}

#bar{
  position:fixed;left:0;right:0;bottom:0;background:var(--surface);
  border-top:2px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:none;
}
#bar.on{display:block}
#bar .inner{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:14px}
#bar-thumb{width:58px;height:58px;border-radius:10px;object-fit:cover;flex:none;background:var(--line)}
#bar-text{flex:1;min-width:0}
#bar-title{font-size:19px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar-sub{font-size:16px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar button{flex:none;min-width:64px;padding:12px}
#bar .icon{font-size:22px;line-height:1}
#bar-stop{border:none;background:none;color:var(--ink-soft);font-size:16px;min-width:0;min-height:0;padding:8px}

#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:32px;text-align:center;z-index:10}
#loading .box{max-width:420px}
#loading h2{font-size:23px;margin:0 0 10px;font-weight:650}
#loading p{color:var(--ink-soft);margin:0 0 18px}
#loading progress{width:100%;height:12px}
#loading.done{display:none}

.err{max-width:900px;margin:24px auto;padding:16px 22px;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>
</head>
<body>

<div id="loading" class="done"><div class="box">
  <h2>Henter musikken</h2>
  <p id="load-text">Det sker kun første gang. Bagefter virker appen uden internet.</p>
  <progress id="load-prog" value="0" max="100"></progress>
</div></div>

<header>
  <h1 id="app-title">Guitarklange</h1>
  <p id="app-sub">Klik og lyt</p>
</header>

<main><div class="grid" id="grid"></div></main>

<div id="bar" role="region" aria-label="Afspiller">
  <div class="inner">
    <img id="bar-thumb" alt="">
    <div id="bar-text">
      <div id="bar-title" aria-live="polite"></div>
      <div id="bar-sub"></div>
    </div>
    <button id="bar-play" aria-label="Pause"><span class="icon">❚❚</span></button>
    <button id="bar-next" aria-label="Næste nummer"><span class="icon">▶▶</span></button>
  </div>
  <div class="inner" style="justify-content:flex-end;margin-top:2px">
    <button id="bar-stop">Stop</button>
  </div>
</div>

<script>
const INLINE_DATA = null;
const CACHE = 'musikpakke-1gyaujh';

let data = null, koe = [], pos = -1, aktivMix = [];
const audio = new Audio();
audio.preload = 'auto';

const $ = id => document.getElementById(id);

function tid(s){
  s = Math.round(s||0);
  const m = Math.floor(s/60), r = s%60;
  return m + ':' + String(r).padStart(2,'0');
}
function mixLaengde(m){
  const t = m.spor.reduce((a,s)=>a+(s.laengde||0),0);
  return Math.round(t/60) + ' min · ' + m.spor.length + ' numre';
}

function tegn(){
  const grid = $('grid');
  grid.innerHTML = '';
  data.mix.forEach(m => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.mix = m.id;

    if (m.cover) {
      const img = document.createElement('img');
      img.className = 'cover'; img.src = m.cover; img.alt = '';
      card.appendChild(img);
    } else {
      const ph = document.createElement('div');
      ph.className = 'cover none'; ph.textContent = '♪';
      card.appendChild(ph);
    }

    const body = document.createElement('div');
    body.className = 'card-body';
    const h = document.createElement('h2'); h.textContent = m.titel;
    const meta = document.createElement('p'); meta.className = 'meta'; meta.textContent = mixLaengde(m);
    const act = document.createElement('div'); act.className = 'actions';

    const bPlay = document.createElement('button');
    bPlay.className = 'play'; bPlay.textContent = 'Afspil';
    bPlay.onclick = () => start([m.id]);

    const bQ = document.createElement('button');
    bQ.className = 'queue'; bQ.textContent = 'Sæt i kø';
    bQ.onclick = () => saetIKoe(m.id, bQ);

    act.appendChild(bPlay); act.appendChild(bQ);
    body.appendChild(h); body.appendChild(meta); body.appendChild(act);
    card.appendChild(body);
    grid.appendChild(card);
  });
  opdaterKort();
}

function opdaterKort(){
  document.querySelectorAll('.card').forEach(c => {
    const id = c.dataset.mix;
    const spiller = aktivMix.includes(id);
    c.classList.toggle('playing', spiller && naaendeMix() === id);
    const q = c.querySelector('.queue');
    if (spiller) { q.classList.add('on'); q.textContent = 'I kø'; }
    else { q.classList.remove('on'); q.textContent = 'Sæt i kø'; }
  });
}
function naaendeMix(){ return pos >= 0 && koe[pos] ? koe[pos].mixId : null; }

function byg(mixIds){
  const liste = [];
  mixIds.forEach(id => {
    const m = data.mix.find(x => x.id === id);
    if (!m) return;
    m.spor.forEach(s => liste.push({
      fil: s.fil, titel: s.titel, kunstner: s.kunstner,
      mixId: m.id, mixTitel: m.titel, cover: m.cover
    }));
  });
  return liste;
}

function start(mixIds){
  aktivMix = mixIds.slice();
  koe = byg(aktivMix);
  pos = -1;
  naeste();
}

function saetIKoe(id, knap){
  if (aktivMix.includes(id)) {
    if (naaendeMix() === id) return;
    aktivMix = aktivMix.filter(x => x !== id);
  } else {
    aktivMix.push(id);
  }
  if (pos < 0) { opdaterKort(); return; }
  const spillerNu = koe[pos];
  koe = byg(aktivMix);
  const i = koe.findIndex(s => s.fil === spillerNu.fil);
  pos = i >= 0 ? i : pos;
  opdaterKort();
}

function naeste(){
  if (pos + 1 >= koe.length) { stop(); return; }
  pos++;
  const s = koe[pos];
  audio.src = s.fil;
  audio.play().catch(()=>{});
  visBar(s);
  opdaterKort();
}

function visBar(s){
  $('bar').classList.add('on');
  $('bar-title').textContent = s.titel;
  $('bar-sub').textContent = (s.kunstner ? s.kunstner + ' · ' : '') + s.mixTitel;
  if (s.cover) $('bar-thumb').src = s.cover;
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: s.titel, artist: s.kunstner || '', album: s.mixTitel,
      artwork: s.cover ? [{src:s.cover, sizes:'512x512', type:'image/jpeg'}] : []
    });
  }
}

function stop(){
  audio.pause(); audio.removeAttribute('src'); audio.load();
  pos = -1; koe = []; aktivMix = [];
  $('bar').classList.remove('on');
  opdaterKort();
}

audio.addEventListener('ended', naeste);
audio.addEventListener('error', () => { if (pos >= 0) naeste(); });
audio.addEventListener('play',  () => { $('bar-play').innerHTML = '<span class="icon">❚❚</span>'; $('bar-play').setAttribute('aria-label','Pause'); });
audio.addEventListener('pause', () => { $('bar-play').innerHTML = '<span class="icon">▶</span>';  $('bar-play').setAttribute('aria-label','Afspil'); });

$('bar-play').onclick = () => { audio.paused ? audio.play() : audio.pause(); };
$('bar-next').onclick = naeste;
$('bar-stop').onclick = stop;

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play',  () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('nexttrack', naeste);
}

async function init(){
  try {
    data = INLINE_DATA || await (await fetch('data/playlists.json')).json();
  } catch (e) {
    document.querySelector('main').innerHTML =
      '<div class="err">Musikken kunne ikke indlæses. Filen data/playlists.json mangler i mappen.</div>';
    return;
  }
  if (data.titel) { $('app-title').textContent = data.titel; document.title = data.titel; }
  if (data.undertekst !== undefined) $('app-sub').textContent = data.undertekst;
  tegn();
  if (!INLINE_DATA) hentAlt();
}

async function hentAlt(){
  if (!('serviceWorker' in navigator) || !('caches' in window)) return;
  const filer = [];
  data.mix.forEach(m => { if (m.cover) filer.push(m.cover); m.spor.forEach(s => filer.push(s.fil)); });
  const cache = await caches.open(CACHE);
  const mangler = [];
  for (const f of filer) { if (!(await cache.match(f))) mangler.push(f); }

  if (mangler.length) {
    $('loading').classList.remove('done');
    $('load-prog').max = mangler.length;
    let n = 0;
    for (const f of mangler) {
      try { await cache.add(f); } catch (e) {}
      n++;
      $('load-prog').value = n;
      $('load-text').textContent = 'Henter ' + n + ' af ' + mangler.length + '. Det sker kun første gang.';
    }
    $('loading').classList.add('done');
  }
  try { await navigator.serviceWorker.register('sw.js'); } catch (e) {}
}

init();
</script>
</body>
</html>
